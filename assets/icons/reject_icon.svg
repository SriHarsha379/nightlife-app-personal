<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowRed" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="redGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E2E"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <g filter="url(#glowRed)" fill="none" stroke="url(#redGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow shaft: from near the X (right) trailing up-left, pointing away/left -->
    <path d="M 235 120 L 55 35"/>
    <!-- Arrowhead pointing up-left -->
    <path d="M 22 20 L 55 35 L 47 72"/>
    <!-- X mark, positioned at the tail end of the arrow (right side) -->
    <path d="M 205 90 L 262 148"/>
    <path d="M 262 90 L 205 148"/>
  </g>
</svg>
